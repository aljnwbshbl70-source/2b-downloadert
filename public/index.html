<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصه تحميل من تيك توك بدون حقوق واعلى جوده</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0e12;
            --card-bg: rgba(25, 33, 44, 0.75);
            --accent-color: #66fcf1;
            --accent-dark: #45a29e;
            --text-color: #c5c6c7;
            --white: #ffffff;
            --error-color: #ff4d4d;
            --whatsapp-green: #25D366;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, rgba(102, 252, 241, 0.08), transparent 70%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 620px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(102, 252, 241, 0.18);
            border-radius: 20px;
            padding: 35px 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        .header {
            margin-bottom: 28px;
        }

        .header h1 {
            color: var(--white);
            font-size: 30px;
            font-weight: 900;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .header h1 span {
            color: var(--accent-color);
            text-shadow: 0 0 12px rgba(102, 252, 241, 0.4);
        }

        .header p {
            font-size: 14px;
            color: #8892b0;
        }

        .input-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .input-box input {
            flex: 1;
            padding: 15px 18px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background-color: rgba(11, 12, 16, 0.8);
            color: var(--white);
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-box input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 12px rgba(102, 252, 241, 0.25);
        }

        .btn-download {
            padding: 15px 24px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent-color), var(--accent-dark));
            color: #0b0c10;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(102, 252, 241, 0.2);
        }

        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 252, 241, 0.4);
        }

        .loader {
            display: none;
            margin: 25px 0;
        }

        .spinner {
            width: 42px;
            height: 42px;
            border: 4px solid rgba(102, 252, 241, 0.1);
            border-top: 4px solid var(--accent-color);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin: 0 auto 12px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result-card {
            display: none;
            background: rgba(17, 22, 29, 0.9);
            border-radius: 14px;
            padding: 20px;
            margin-top: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            text-align: right;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .media-info {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 20px;
        }

        .media-info img {
            width: 75px;
            height: 75px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid var(--accent-dark);
        }

        .media-details h3 {
            color: var(--white);
            font-size: 15px;
            line-height: 1.4;
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .media-details p {
            font-size: 13px;
            color: var(--accent-color);
        }

        .download-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .btn-action {
            flex: 1;
            min-width: 140px;
            padding: 12px;
            text-align: center;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            transition: opacity 0.2s;
        }

        .btn-video {
            background-color: var(--accent-color);
            color: #0b0c10;
        }

        .btn-audio {
            background-color: #2a323d;
            color: var(--white);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-action:hover {
            opacity: 0.88;
        }

        .error-msg {
            display: none;
            color: var(--error-color);
            background: rgba(255, 77, 77, 0.1);
            border: 1px solid rgba(255, 77, 77, 0.2);
            padding: 12px;
            border-radius: 10px;
            margin-top: 15px;
            font-size: 14px;
        }

        /* تصميم قسم قناة التحديثات */
        .channel-card {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .channel-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: rgba(37, 211, 102, 0.12);
            color: var(--whatsapp-green);
            border: 1px solid rgba(37, 211, 102, 0.3);
            padding: 10px 20px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            transition: all 0.3s ease;
        }

        .channel-btn:hover {
            background-color: var(--whatsapp-green);
            color: #0b0c10;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
            transform: translateY(-2px);
        }

        footer {
            margin-top: 15px;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>⚔️ <span>🇾🇪🇸🇦🇪🇬</span> منصه تحميل نن من تيك توك بدون حقوق</h1>
            <p>تحميل مقاطع TikTok و  بأعلى جودة وبدون علامة مائية</p>
        </div>

        <div class="input-box">
            <input type="text" id="videoUrl" placeholder="ألصق رابط تيك توك هنا..">
            <button class="btn-download" onclick="processDownload()">تحميل ⚡</button>
        </div>

        <div class="loader" id="loader">
            <div class="spinner"></div>
            <p>جاري استخراج رابط الفيديو بواسطة 2B Unit...</p>
        </div>

        <div class="error-msg" id="errorMsg"></div>

        <div class="result-card" id="resultCard">
            <div class="media-info">
                <img id="thumbImg" src="" alt="Thumbnail">
                <div class="media-details">
                    <h3 id="mediaTitle">عنوان الفيديو</h3>
                    <p id="mediaAuthor">المؤلف</p>
                </div>
            </div>

            <div class="download-actions">
                <a id="downloadVideoBtn" class="btn-action btn-video" href="#" target="_blank" download>🎬 تحميل الفيديو (MP4)</a>
                <a id="downloadAudioBtn" class="btn-action btn-audio" href="#" target="_blank" download style="display:none;">🎵 تحميل الصوت (MP3)</a>
            </div>
        </div>

        <!-- زر قناة التحديثات -->
        <div class="channel-card">
            <a href="https://whatsapp.com/channel/0029VbClAWDFXUuh4N1kdf2A" target="_blank" class="channel-btn">
                📢 قناة التحديثات
            </a>
            <footer>
                YoRHa Unit No.2 Type B — Web Engine
            </footer>
        </div>
    </div>

    <script>
        async function processDownload() {
            const urlInput = document.getElementById('videoUrl').value.trim();
            const loader = document.getElementById('loader');
            const resultCard = document.getElementById('resultCard');
            const errorMsg = document.getElementById('errorMsg');
            const downloadAudioBtn = document.getElementById('downloadAudioBtn');

            if (!urlInput) {
                showError('يرجى إدخال رابط الفيديو أولاً!');
                return;
            }

            errorMsg.style.display = 'none';
            resultCard.style.display = 'none';
            loader.style.display = 'block';

            try {
                const response = await fetch('/api/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: urlInput })
                });

                const resData = await response.json();

                if (!response.ok || !resData.success) {
                    throw new Error(resData.error || 'حدث خطأ غير متوقع');
                }

                const data = resData.data;

                document.getElementById('thumbImg').src = data.cover || 'https://via.placeholder.com/80';
                document.getElementById('mediaTitle').innerText = data.title;
                document.getElementById('mediaAuthor').innerText = `@${data.author}`;
                
                const videoBtn = document.getElementById('downloadVideoBtn');
                videoBtn.href = data.video;

                if (data.audio) {
                    downloadAudioBtn.href = data.audio;
                    downloadAudioBtn.style.display = 'inline-block';
                } else {
                    downloadAudioBtn.style.display = 'none';
                }

                loader.style.display = 'none';
                resultCard.style.display = 'block';

            } catch (err) {
                loader.style.display = 'none';
                showError(err.message);
            }
        }

        function showError(msg) {
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.innerText = `❌ ${msg}`;
            errorMsg.style.display = 'block';
        }
    </script>
</body>
</html>
