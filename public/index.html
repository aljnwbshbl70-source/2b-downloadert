<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2B Downloader | YoRHa Media Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #1f2833;
            --accent-color: #66fcf1;
            --accent-dark: #45a29e;
            --text-color: #c5c6c7;
            --white: #ffffff;
            --error-color: #ff4d4d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: rgba(31, 40, 51, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(102, 252, 241, 0.2);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }

        .header {
            margin-bottom: 25px;
        }

        .header h1 {
            color: var(--white);
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 8px;
        }

        .header h1 span {
            color: var(--accent-color);
        }

        .header p {
            font-size: 14px;
            color: #8892b0;
        }

        .input-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .input-box input {
            flex: 1;
            padding: 14px 18px;
            border-radius: 10px;
            border: 1px solid #333;
            background-color: #0b0c10;
            color: var(--white);
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
        }

        .input-box input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 10px rgba(102, 252, 241, 0.3);
        }

        .btn-download {
            padding: 14px 24px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--accent-color), var(--accent-dark));
            color: #0b0c10;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 252, 241, 0.4);
        }

        .loader {
            display: none;
            margin: 20px 0;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(102, 252, 241, 0.1);
            border-top: 4px solid var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result-card {
            display: none;
            background: #11161d;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: right;
        }

        .media-info {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 20px;
        }

        .media-info img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid var(--accent-dark);
        }

        .media-details h3 {
            color: var(--white);
            font-size: 16px;
            margin-bottom: 5px;
        }

        .media-details p {
            font-size: 13px;
            color: var(--accent-color);
        }

        .download-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .btn-action {
            flex: 1;
            min-width: 130px;
            padding: 12px;
            text-align: center;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
        }

        .btn-video {
            background-color: var(--accent-color);
            color: #0b0c10;
        }

        .btn-audio {
            background-color: #333;
            color: var(--white);
            border: 1px solid #555;
        }

        .error-msg {
            display: none;
            color: var(--error-color);
            background: rgba(255, 77, 77, 0.1);
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>⚔️ <span>2B</span> MEDIA DOWNLOADER</h1>
            <p>تحميل فيديوهات TikTok و Instagram بدون علامة مائية</p>
        </div>

        <div class="input-box">
            <input type="text" id="videoUrl" placeholder="ألصق رابط تيك توك أو إنستغرام هنا...">
            <button class="btn-download" onclick="processDownload()">تحميل ⚡</button>
        </div>

        <div class="loader" id="loader">
            <div class="spinner"></div>
            <p>جاري استخراج رابط الفيديو بواسطة 2B Unit...</p>
        </div>

        <div class="error-msg" id="errorMsg"></div>

        <div class="result-card" id="resultCard">
            <div class="media-info">
                <img id="thumbImg" src="" alt="Thumbnail">
                <div class="media-details">
                    <h3 id="mediaTitle">عنوان الفيديو</h3>
                    <p id="mediaAuthor">المؤلف</p>
                </div>
            </div>

            <div class="download-actions">
                <a id="downloadVideoBtn" class="btn-action btn-video" href="#" target="_blank" download>🎬 تحميل الفيديو (MP4)</a>
                <a id="downloadAudioBtn" class="btn-action btn-audio" href="#" target="_blank" download style="display:none;">🎵 تحميل الصوت (MP3)</a>
            </div>
        </div>
    </div>

    <script>
        async function processDownload() {
            const urlInput = document.getElementById('videoUrl').value.trim();
            const loader = document.getElementById('loader');
            const resultCard = document.getElementById('resultCard');
            const errorMsg = document.getElementById('errorMsg');
            const downloadAudioBtn = document.getElementById('downloadAudioBtn');

            if (!urlInput) {
                showError('يرجى إدخال رابط الفيديو أولاً!');
                return;
            }

            errorMsg.style.display = 'none';
            resultCard.style.display = 'none';
            loader.style.display = 'block';

            try {
                const response = await fetch('/api/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: urlInput })
                });

                const resData = await response.json();

                if (!response.ok || !resData.success) {
                    throw new Error(resData.error || 'حدث خطأ غير متوقع');
                }

                const data = resData.data;

                document.getElementById('thumbImg').src = data.cover || 'https://via.placeholder.com/80';
                document.getElementById('mediaTitle').innerText = data.title;
                document.getElementById('mediaAuthor').innerText = `@${data.author}`;
                
                const videoBtn = document.getElementById('downloadVideoBtn');
                videoBtn.href = data.video;

                if (data.audio) {
                    downloadAudioBtn.href = data.audio;
                    downloadAudioBtn.style.display = 'inline-block';
                } else {
                    downloadAudioBtn.style.display = 'none';
                }

                loader.style.display = 'none';
                resultCard.style.display = 'block';

            } catch (err) {
                loader.style.display = 'none';
                showError(err.message);
            }
        }

        function showError(msg) {
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.innerText = `❌ ${msg}`;
            errorMsg.style.display = 'block';
        }
    </script>
</body>
</html>
